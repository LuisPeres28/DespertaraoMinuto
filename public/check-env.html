<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Environment</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .container {
            background: #000;
            padding: 30px;
            border: 2px solid #0f0;
            border-radius: 8px;
        }
        h1 {
            color: #0f0;
            text-align: center;
            text-shadow: 0 0 10px #0f0;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid;
        }
        .success {
            background: #001a00;
            color: #0f0;
            border-color: #0f0;
        }
        .error {
            background: #1a0000;
            color: #f00;
            border-color: #f00;
        }
        .warning {
            background: #1a1a00;
            color: #ff0;
            border-color: #ff0;
        }
        pre {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid #333;
            color: #0f0;
        }
        .label {
            color: #0ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 ENVIRONMENT CHECK</h1>
        <div id="results"></div>
    </div>

    <script>
        const results = document.getElementById('results');

        // Expected values
        const EXPECTED_URL = 'https://dnswlrvleqvsueawxzfy.supabase.co';
        const EXPECTED_KEY_START = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9';

        let html = '';

        // Check if we're in production
        const isProduction = window.location.hostname !== 'localhost';
        html += `<div class="status ${isProduction ? 'success' : 'warning'}">
            <span class="label">🌍 ENVIRONMENT:</span> ${isProduction ? 'PRODUCTION' : 'DEVELOPMENT'}
        </div>`;

        // Show current URL
        html += `<div class="status success">
            <span class="label">📍 CURRENT URL:</span><br>
            <code>${window.location.href}</code>
        </div>`;

        // The built app should have these hardcoded as fallbacks
        html += `<div class="status success">
            <span class="label">✅ EXPECTED SUPABASE URL:</span><br>
            <code>${EXPECTED_URL}</code>
        </div>`;

        html += `<div class="status success">
            <span class="label">✅ EXPECTED ANON KEY (first 50 chars):</span><br>
            <code>${EXPECTED_KEY_START}...</code>
        </div>`;

        // Instructions
        html += `<div class="status warning" style="margin-top: 30px;">
            <span class="label">⚙️ NETLIFY CONFIGURATION NEEDED:</span><br><br>

            <strong>1. Go to Netlify Dashboard:</strong><br>
            → Site settings → Build & deploy → Environment variables<br><br>

            <strong>2. Add these variables:</strong><br>
            <pre>
VITE_SUPABASE_URL=https://dnswlrvleqvsueawxzfy.supabase.co

VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuc3dscnZsZXF2c3VlYXd4emZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkzODEyMjIsImV4cCI6MjA3NDk1NzIyMn0.bsg6sfD9d2CT5EiiGWOKtl1FeaeN1DnDYiUtLeqkOmQ
            </pre>

            <strong>3. Trigger a redeploy:</strong><br>
            → Deploys → Trigger deploy → Deploy site<br><br>

            <strong>NOTE:</strong> Even though the code has fallback values, it's best practice to set them in Netlify.
        </div>`;

        html += `<div class="status error" style="margin-top: 20px;">
            <span class="label">🐛 CURRENT ISSUE:</span><br><br>
            The Supabase client is not connecting properly. The logs show malformed URLs like:<br>
            <code>"dkzvzgjbodwvxhudwwaj...il.com%29&limit=1:1"</code><br><br>
            This indicates the Supabase client isn't initializing correctly.
        </div>`;

        results.innerHTML = html;
    </script>
</body>
</html>
