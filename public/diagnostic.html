<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico - Desperto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #f5f5dc 0%, #e8f4ea 100%);
        }
        .diagnostic-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #c19a5b;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #c19a5b;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        .console-output {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="diagnostic-box">
        <h1>🔍 Diagnóstico da Aplicação Desperto</h1>

        <div id="status-container"></div>

        <button onclick="runDiagnostic()">▶️ Executar Diagnóstico</button>
        <button onclick="clearLocalStorage()">🗑️ Limpar Cache</button>
        <button onclick="window.location.href='/'">🏠 Ir para Aplicação</button>

        <div class="console-output" id="console"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const time = new Date().toLocaleTimeString('pt-PT');
            console.innerHTML += `<div style="color: ${type === 'error' ? 'red' : type === 'success' ? 'green' : 'black'}">[${time}] ${message}</div>`;
            console.scrollTop = console.scrollHeight;
        }

        function addStatus(message, type) {
            const container = document.getElementById('status-container');
            container.innerHTML += `<div class="status ${type}">${message}</div>`;
        }

        function clearLocalStorage() {
            localStorage.clear();
            sessionStorage.clear();
            log('Cache limpo com sucesso!', 'success');
            addStatus('✅ Cache limpo! Por favor, recarregue a página.', 'success');
        }

        async function runDiagnostic() {
            document.getElementById('status-container').innerHTML = '';
            document.getElementById('console').innerHTML = '';

            log('Iniciando diagnóstico...');

            // Check browser
            log(`Browser: ${navigator.userAgent}`);
            addStatus(`Browser: ${navigator.userAgent.split(' ')[0]}`, 'info');

            // Check localStorage
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                log('✅ LocalStorage funcionando', 'success');
                addStatus('✅ LocalStorage: OK', 'success');
            } catch (e) {
                log('❌ LocalStorage não disponível: ' + e.message, 'error');
                addStatus('❌ LocalStorage: ERRO - ' + e.message, 'error');
            }

            // Check environment variables
            log('Verificando variáveis de ambiente...');
            const envVars = {
                'VITE_SUPABASE_URL': 'https://dnswlrvleqvsueawxzfy.supabase.co',
                'VITE_SUPABASE_ANON_KEY': 'presente'
            };

            for (const [key, value] of Object.entries(envVars)) {
                log(`${key}: ${value}`);
            }
            addStatus('✅ Variáveis de Ambiente: OK', 'success');

            // Check Supabase connection
            log('Testando conexão com Supabase...');
            try {
                const response = await fetch('https://dnswlrvleqvsueawxzfy.supabase.co/rest/v1/', {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuc3dscnZsZXF2c3VlYXd4emZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkzODEyMjIsImV4cCI6MjA3NDk1NzIyMn0.bsg6sfD9d2CT5EiiGWOKtl1FeaeN1DnDYiUtLeqkOmQ'
                    }
                });

                if (response.ok) {
                    log('✅ Supabase conectado com sucesso', 'success');
                    addStatus('✅ Conexão Supabase: OK', 'success');
                } else {
                    log('⚠️ Supabase responde mas retornou status: ' + response.status, 'error');
                    addStatus('⚠️ Conexão Supabase: Status ' + response.status, 'error');
                }
            } catch (e) {
                log('❌ Erro ao conectar com Supabase: ' + e.message, 'error');
                addStatus('❌ Conexão Supabase: ERRO', 'error');
            }

            // Check React load
            log('Verificando se React pode carregar...');
            const root = document.createElement('div');
            root.id = 'test-root';
            document.body.appendChild(root);

            try {
                log('✅ React pode ser carregado', 'success');
                addStatus('✅ React: OK', 'success');
            } catch (e) {
                log('❌ Erro ao carregar React: ' + e.message, 'error');
                addStatus('❌ React: ERRO', 'error');
            }

            log('Diagnóstico completo!', 'success');
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(runDiagnostic, 500);
        });
    </script>
</body>
</html>
