<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Configuração - Desperto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .status-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #ddd;
    }

    .status-card.success {
      background: #d4edda;
      border-left-color: #28a745;
    }

    .status-card.error {
      background: #f8d7da;
      border-left-color: #dc3545;
    }

    .status-card.warning {
      background: #fff3cd;
      border-left-color: #ffc107;
    }

    .status-title {
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-icon {
      font-size: 20px;
    }

    .status-details {
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    .code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s;
      width: 100%;
      margin-top: 10px;
    }

    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .logs {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
    }

    .log-entry {
      margin: 5px 0;
      padding: 4px 0;
    }

    .log-success { color: #4ade80; }
    .log-error { color: #ef4444; }
    .log-warning { color: #fbbf24; }
    .log-info { color: #60a5fa; }

    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 30px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Diagnóstico do Sistema</h1>
    <p class="subtitle">Verificação de configuração do Desperto</p>

    <div id="results"></div>

    <button class="btn" onclick="runDiagnostics()">🔄 Executar Testes Novamente</button>

    <div class="divider"></div>

    <div class="logs" id="logs">
      <strong>📋 Console de Logs:</strong>
      <div id="logEntries"></div>
    </div>
  </div>

  <script>
    const resultsDiv = document.getElementById('results');
    const logEntriesDiv = document.getElementById('logEntries');

    function addLog(message, type = 'info') {
      const logEntry = document.createElement('div');
      logEntry.className = `log-entry log-${type}`;
      const timestamp = new Date().toLocaleTimeString();
      logEntry.textContent = `[${timestamp}] ${message}`;
      logEntriesDiv.appendChild(logEntry);
      logEntriesDiv.parentElement.scrollTop = logEntriesDiv.parentElement.scrollHeight;
    }

    function createStatusCard(title, icon, details, type = 'info') {
      return `
        <div class="status-card ${type}">
          <div class="status-title">
            <span class="status-icon">${icon}</span>
            ${title}
          </div>
          <div class="status-details">${details}</div>
        </div>
      `;
    }

    async function runDiagnostics() {
      resultsDiv.innerHTML = '';
      logEntriesDiv.innerHTML = '';

      addLog('🔍 Iniciando diagnóstico do sistema...', 'info');

      // 1. Verificar variáveis de ambiente
      addLog('📋 Verificando variáveis de ambiente...', 'info');

      const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
      const supabaseKey = import.meta.env.VITE_SUPABASE_ANON_KEY;

      if (!supabaseUrl || !supabaseKey) {
        addLog('❌ ERRO: Variáveis de ambiente não encontradas!', 'error');

        resultsDiv.innerHTML += createStatusCard(
          '❌ Variáveis de Ambiente',
          '🚨',
          `
            <strong>PROBLEMA DETECTADO:</strong> As variáveis de ambiente do Supabase não estão configuradas.<br><br>
            <strong>Variáveis necessárias:</strong><br>
            • <span class="code">VITE_SUPABASE_URL</span>: ${supabaseUrl ? '✅ Configurada' : '❌ Não encontrada'}<br>
            • <span class="code">VITE_SUPABASE_ANON_KEY</span>: ${supabaseKey ? '✅ Configurada' : '❌ Não encontrada'}<br><br>
            <strong>Solução:</strong><br>
            1. Ir para <a href="https://app.netlify.com" target="_blank">Netlify Dashboard</a><br>
            2. Selecionar o site Desperto<br>
            3. Ir para "Site configuration" → "Environment variables"<br>
            4. Adicionar as variáveis necessárias<br>
            5. Fazer redeploy do site<br><br>
            📄 Consulte o ficheiro <strong>SOLUCAO_LOGIN_NETLIFY.md</strong> para instruções detalhadas.
          `,
          'error'
        );

        return;
      }

      addLog('✅ Variáveis de ambiente encontradas', 'success');

      resultsDiv.innerHTML += createStatusCard(
        '✅ Variáveis de Ambiente',
        '✓',
        `
          As variáveis de ambiente estão configuradas corretamente:<br><br>
          • <span class="code">VITE_SUPABASE_URL</span>: ${supabaseUrl.substring(0, 35)}...<br>
          • <span class="code">VITE_SUPABASE_ANON_KEY</span>: ${supabaseKey.substring(0, 40)}... (${supabaseKey.length} caracteres)
        `,
        'success'
      );

      // 2. Testar conexão com Supabase
      addLog('🌐 Testando conexão com Supabase...', 'info');

      try {
        const response = await fetch(`${supabaseUrl}/rest/v1/`, {
          headers: {
            'apikey': supabaseKey,
            'Authorization': `Bearer ${supabaseKey}`
          }
        });

        if (response.ok || response.status === 404) {
          addLog('✅ Conexão com Supabase estabelecida', 'success');

          resultsDiv.innerHTML += createStatusCard(
            '✅ Conexão com Supabase',
            '🔗',
            `
              A conexão com o servidor Supabase foi estabelecida com sucesso.<br>
              <strong>Status:</strong> ${response.status} ${response.statusText}
            `,
            'success'
          );
        } else {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
      } catch (error) {
        addLog(`❌ Erro de conexão: ${error.message}`, 'error');

        resultsDiv.innerHTML += createStatusCard(
          '❌ Conexão com Supabase',
          '⚠️',
          `
            <strong>PROBLEMA:</strong> Não foi possível conectar ao Supabase.<br><br>
            <strong>Erro:</strong> ${error.message}<br><br>
            <strong>Possíveis causas:</strong><br>
            • URL do Supabase incorreto<br>
            • Problemas de rede<br>
            • Firewall bloqueando a conexão<br><br>
            <strong>Solução:</strong> Verificar a URL e a chave no Netlify.
          `,
          'error'
        );

        return;
      }

      // 3. Testar função authenticate_user
      addLog('🔐 Testando função de autenticação...', 'info');

      try {
        const response = await fetch(`${supabaseUrl}/rest/v1/rpc/authenticate_user`, {
          method: 'POST',
          headers: {
            'apikey': supabaseKey,
            'Authorization': `Bearer ${supabaseKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            p_identifier: 'test_invalid_user',
            p_password: 'test_invalid_password'
          })
        });

        // Esperamos status 200 com array vazio (credenciais inválidas)
        if (response.ok) {
          const data = await response.json();
          addLog('✅ Função authenticate_user está acessível', 'success');

          resultsDiv.innerHTML += createStatusCard(
            '✅ Função de Autenticação',
            '🔐',
            `
              A função <span class="code">authenticate_user</span> está disponível e funcionando.<br>
              <strong>Status:</strong> Pronta para uso<br><br>
              <strong>Nota:</strong> Testado com credenciais inválidas (esperado).
            `,
            'success'
          );
        } else {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
      } catch (error) {
        addLog(`❌ Erro ao testar autenticação: ${error.message}`, 'error');

        resultsDiv.innerHTML += createStatusCard(
          '❌ Função de Autenticação',
          '⚠️',
          `
            <strong>PROBLEMA:</strong> A função de autenticação não está disponível.<br><br>
            <strong>Erro:</strong> ${error.message}<br><br>
            <strong>Possíveis causas:</strong><br>
            • Migrations não foram aplicadas<br>
            • Função foi removida ou renomeada<br>
            • Permissões insuficientes<br><br>
            <strong>Solução:</strong> Verificar o Supabase Dashboard e aplicar as migrations.
          `,
          'error'
        );

        return;
      }

      // 4. Teste final
      addLog('✅ Todos os testes passaram com sucesso!', 'success');

      resultsDiv.innerHTML += createStatusCard(
        '✅ Sistema Pronto',
        '🎉',
        `
          <strong>Parabéns!</strong> O sistema está configurado corretamente.<br><br>
          <strong>Próximos passos:</strong><br>
          1. Voltar para a página inicial<br>
          2. Tentar fazer login com as suas credenciais<br>
          3. Se o login falhar, verificar se a password está correta<br><br>
          <strong>Credenciais de teste:</strong><br>
          • Email: <span class="code">cliente@teste.com</span><br>
          • Password: <span class="code">123456</span>
        `,
        'success'
      );
    }

    // Executar diagnóstico automaticamente ao carregar
    runDiagnostics();
  </script>
</body>
</html>
