<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Connection Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .test {
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border-left: 4px solid;
        }
        .loading {
            background: #e3f2fd;
            border-color: #2196f3;
            color: #1976d2;
        }
        .success {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #2e7d32;
        }
        .error {
            background: #ffebee;
            border-color: #f44336;
            color: #c62828;
        }
        .code {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 10px;
            overflow-x: auto;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔌 Teste de Conexão Supabase</h1>
        <div id="results"></div>
        <button onclick="runTests()">▶ Executar Testes</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://dnswlrvleqvsueawxzfy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuc3dscnZsZXF2c3VlYXd4emZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkzODEyMjIsImV4cCI6MjA3NDk1NzIyMn0.bsg6sfD9d2CT5EiiGWOKtl1FeaeN1DnDYiUtLeqkOmQ';

        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '';

            // Test 1: Initialize client
            addResult('loading', '⏳ Inicializando cliente Supabase...');
            await sleep(500);

            let supabase;
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                addResult('success', '✅ Cliente inicializado com sucesso!', {
                    url: SUPABASE_URL,
                    key: SUPABASE_KEY.substring(0, 30) + '...'
                });
            } catch (err) {
                addResult('error', '❌ Erro ao inicializar cliente', err.message);
                return;
            }

            await sleep(500);

            // Test 2: Simple query
            addResult('loading', '⏳ Testando query simples (SELECT count)...');
            await sleep(500);

            try {
                const { data, error, count } = await supabase
                    .from('users')
                    .select('*', { count: 'exact', head: true });

                if (error) {
                    addResult('error', '❌ Erro na query', error.message);
                } else {
                    addResult('success', `✅ Query bem-sucedida! ${count} utilizadores encontrados`);
                }
            } catch (err) {
                addResult('error', '❌ Erro fatal na query', err.message);
            }

            await sleep(500);

            // Test 3: RPC authenticate_user
            addResult('loading', '⏳ Testando função authenticate_user...');
            await sleep(500);

            try {
                const { data, error } = await supabase.rpc('authenticate_user', {
                    p_identifier: 'euestoudesperto@gmail.com',
                    p_password: 'Desperto2024!'
                });

                if (error) {
                    addResult('error', '❌ Erro na função RPC', error.message);
                } else if (data && data.success) {
                    addResult('success', '✅ Autenticação bem-sucedida!', {
                        username: data.user.username,
                        email: data.user.email,
                        type: data.user.user_type
                    });
                } else {
                    addResult('error', '❌ Credenciais incorretas', data);
                }
            } catch (err) {
                addResult('error', '❌ Erro fatal no RPC', err.message);
            }

            await sleep(500);

            // Test 4: Check user
            addResult('loading', '⏳ Verificando dados do utilizador...');
            await sleep(500);

            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('id, email, username, user_type')
                    .eq('email', 'euestoudesperto@gmail.com')
                    .maybeSingle();

                if (error) {
                    addResult('error', '❌ Erro ao buscar utilizador', error.message);
                } else if (data) {
                    addResult('success', '✅ Utilizador encontrado!', data);
                } else {
                    addResult('error', '❌ Utilizador não encontrado');
                }
            } catch (err) {
                addResult('error', '❌ Erro fatal', err.message);
            }
        }

        function addResult(type, message, details = null) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test ${type}`;

            let html = `<strong>${message}</strong>`;
            if (details) {
                html += `<div class="code">${JSON.stringify(details, null, 2)}</div>`;
            }

            div.innerHTML = html;
            results.appendChild(div);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Auto-run on load
        window.onload = () => {
            setTimeout(runTests, 500);
        };
    </script>
</body>
</html>
