<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Autenticação</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #6B6538;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #555;
        }
        .result {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .success {
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left: 4px solid #f44336;
        }
    </style>
</head>
<body>
    <h1>Teste de Autenticação Desperto</h1>

    <div class="test-section">
        <h2>1. Teste Admin</h2>
        <button onclick="testAdmin()">Testar Login Admin</button>
        <div id="admin-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>2. Teste Cliente</h2>
        <button onclick="testClient()">Testar Login Cliente</button>
        <div id="client-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>3. Teste Credenciais Incorretas</h2>
        <button onclick="testWrongPassword()">Testar Password Errada</button>
        <div id="wrong-result" class="result"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dnswlrvleqvsueawxzfy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuc3dscnZsZXF2c3VlYXd4emZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkzODEyMjIsImV4cCI6MjA3NDk1NzIyMn0.bsg6sfD9d2CT5EiiGWOKtl1FeaeN1DnDYiUtLeqkOmQ';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testLogin(email, password, resultId) {
            const resultDiv = document.getElementById(resultId);
            resultDiv.textContent = 'Testando...';
            resultDiv.className = 'result';

            try {
                console.log('Calling RPC with:', { email, password });

                const { data, error } = await supabase.rpc('authenticate_user', {
                    p_identifier: email,
                    p_password: password
                });

                console.log('Raw Response:', { data, error });
                console.log('Data type:', typeof data);

                if (error) {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'ERRO:\n' + JSON.stringify(error, null, 2);
                    return;
                }

                // Processar data
                let result = data;
                if (typeof data === 'string') {
                    try {
                        result = JSON.parse(data);
                    } catch (e) {
                        resultDiv.className = 'result error';
                        resultDiv.textContent = 'ERRO ao fazer parse:\n' + e.message + '\n\nData: ' + data;
                        return;
                    }
                }

                if (result && result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = 'SUCESSO!\n\n' + JSON.stringify(result, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'FALHA:\n' + JSON.stringify(result, null, 2);
                }
            } catch (err) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'EXCEÇÃO:\n' + err.message + '\n\n' + err.stack;
            }
        }

        function testAdmin() {
            testLogin('euestoudesperto@gmail.com', 'Dhvif2m1', 'admin-result');
        }

        function testClient() {
            testLogin('cliente@teste.com', '123456', 'client-result');
        }

        function testWrongPassword() {
            testLogin('euestoudesperto@gmail.com', 'senhaerrada', 'wrong-result');
        }
    </script>
</body>
</html>
